worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # gzip 压缩（节省 HF 免费层有限带宽）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/octet-stream;

    # Basic Auth 暴力破解限速
    limit_req_zone $binary_remote_addr zone=auth_limit:2m rate=5r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;
        server_name _;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        client_max_body_size 50m;

        # HF 健康检查（无需认证）
        location = / {
            auth_basic off;
            default_type text/plain;
            return 200 "ok";
        }

        location = /healthz {
            auth_basic off;
            default_type text/plain;
            return 200 "ok";
        }

        # Proxy 健康检查（内部）
        location = /proxy/health {
            auth_basic off;
            proxy_pass http://127.0.0.1:18780/health;
            proxy_read_timeout 5s;
        }

        # 备份 API
        location = /api/backup {
            proxy_pass http://127.0.0.1:18790/;
            proxy_read_timeout 300s;
        }

        # Admin 控制台（支持 WebSocket 实时日志）
        location /admin {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://127.0.0.1:18792;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        # OpenClaw 网关（主服务）
        location / {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:18789;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-User $remote_user;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }
    }
}