name: Keep Space Awake

on:
  schedule:
    # 每 15 分钟访问一次 Space 根路径（nginx 对 / 免认证返回 200 ok），
    # 防止 Hugging Face 免费版 Space 因无活动进入休眠，实现持续运行。
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Space root
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "${SPACE_URL}" ]; then
            echo "::error::未配置 SPACE_URL。请在仓库 Settings -> Secrets and variables -> Actions -> Variables 中添加 SPACE_URL（例如 https://用户名-space名.hf.space）"
            exit 1
          fi
          echo "Pinging ${SPACE_URL}/ ..."
          # -L 跟随重定向；--retry 容忍冷启动期间的 5xx/超时
          code=$(curl -sL --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{http_code}' --max-time 30 "${SPACE_URL}/")
          echo "HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Space 根路径返回 ${code}（冷启动中或服务异常），本次保活未生效"
            exit 1
          fi
          echo "Space is awake."
